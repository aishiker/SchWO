[project]
name = "schw-gw-waveoptics"
version = "0.0.0"
description = "Finite-radius partial-wave solver for Schwarzschild gravitational-wave wave optics"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pyyaml",
  "h5py",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
perf = ["numba", "joblib"]

[project.scripts]
schwgw = "schwgw.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
